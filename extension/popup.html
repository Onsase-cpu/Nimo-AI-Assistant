<!doctype html><html><head><meta charset="utf-8"><title>Nimo</title><link rel="stylesheet" href="popup.css"></head><body><main><header><div><div class="brand">nimo</div><div class="tag">calm, capable, close by</div></div><button id="settings">⚙</button></header><section id="auth"><p>Sign in to keep your conversations connected.</p><input id="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button id="login" class="primary">Log in</button><button id="signup" class="secondary">Create account</button></section><section id="assistant" class="hidden"><div id="messages"></div><div class="composer"><textarea id="input" placeholder="Ask Nimo anything…"></textarea><button id="talk" class="talk">Talk</button><button id="send" class="primary">Send</button></div><small id="status">Ready when you are.</small></section><section id="settingsPanel" class="hidden"><label>Assistant API URL<input id="api" placeholder="http://localhost:8080"></label><button id="save" class="primary">Save</button></section></main><script src="popup.js"></script></body></html>
